[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-mirror"
dynamic = ["version"]
description = "Mirror an Android phone or use its camera as a webcam, over Wi-Fi or USB — a small Qt front-end for scrcpy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dragonir", email = "dragonir44@gmail.com" }]
dependencies = ["PySide6>=6.5"]
keywords = ["scrcpy", "android", "screen-mirroring", "webcam", "v4l2loopback", "kde", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Dragonir44/phone-mirror"
Repository = "https://github.com/Dragonir44/phone-mirror"
Issues = "https://github.com/Dragonir44/phone-mirror/issues"

[project.gui-scripts]
phone-mirror = "phone_mirror.__main__:main"

[tool.setuptools]
packages = ["phone_mirror", "phone_mirror.locales"]

[tool.setuptools.package-data]
phone_mirror = ["data/*.desktop"]

[tool.setuptools.dynamic]
version = { attr = "phone_mirror.__version__" }
